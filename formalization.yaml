heat_cited_inputs:
  status: All four are proved; CITED_INPUTS.md#heat-kernel-version lists them and the hypotheses of every
    heat export.
  proved:
  - Murugan-Saloff-Coste Theorem 1.1, for the critical lattice kernel (LatticeProb.Graph.LongRangeKernel.weightedLattice_critical_diagonal)
  - Chen-Kim-Kumagai-Wang Proposition 3.1(ii) (LatticeProb.External.chenKimKumagaiWangNash_holds)
  - Chen-Kim-Kumagai-Wang Theorem 4.4 with Example 4.3 (LatticeProb.External.chenKimKumagaiWangDavies_holds)
  - Kallenberg Theorems 16.10 and 16.11 and Aldous, the sufficiency direction (LatticeProb.Cadlag.HalfLine.tendsto_of_ordered_fdd_of_optional_increment)

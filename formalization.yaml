status:
  scope: The April version (LongRange.Statements) has 23 theorem exports and three complete definition
    exports, including produced unique H10 weak solution, its continuous representative, weak scaling
    obstruction, quenched invariance principle, uniform heat-kernel bounds and norm/kernel
    characterizations. The heat-kernel version (LongRangeHeat.Statements) states Theorems 1.1 and 1.2
    and Propositions 4.1-4.3 with no cited hypothesis, and the other results of that version.
  production_placeholder_tokens: 0
  standalone_build: 'lake build LongRange LongRangeHeat from a fresh checkout, zero warnings or errors
    (the build workflow)'
  public_axiom_audit: 'scripts/check_axioms.py checks all 75 public exports (26 of LongRange.Statements,
    49 of LongRangeHeat.Statements): only propext, Classical.choice and Quot.sound'
  comparator: 'four pairs (LongRangeAudit/): quantitative homogenization and both quenched invariance
    principle formulations of the April version, and the heat-equation homogenization and annealed
    invariance principle of the heat-kernel version; dependency comparison, NanoDa and Lean kernel replay'
  ci: 'Build and export axiom audit: main pushes, pull requests and manual dispatch. Independent
    comparators: manual dispatch. Current hosted results are linked from README badges.'
  allowed_kernel_axioms:
  - propext
  - Classical.choice
  - Quot.sound
